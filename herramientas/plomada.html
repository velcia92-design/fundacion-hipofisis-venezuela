<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Plomada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: visor oscuro a la izquierda con la guía de puntos encima; resultados, historial y comparación a la derecha. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#141b24; --muted:#586374; --line:#d3dae3;
  --accent:#2547c8; --on-accent:#ffffff; --accent-soft:#e4eafc;
  --ok:#126b41; --warn:#8a5600; --bad:#b3261e; --okbg:#e0f2e8; --warnbg:#fbedcf; --badbg:#fbe1de;
  --viewer:#0b0f13; --mark:#ffc933;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1117; --surface:#161c25; --ink:#e6ebf2; --muted:#98a3b5; --line:#28313e;
  --accent:#8fa8ff; --on-accent:#0a1230; --accent-soft:#1b2542;
  --ok:#62d69d; --warn:#f2bd5a; --bad:#ff8f87; --okbg:#10291e; --warnbg:#2d2411; --badbg:#351817; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0d1117; --surface:#161c25; --ink:#e6ebf2; --muted:#98a3b5; --line:#28313e;
  --accent:#8fa8ff; --on-accent:#0a1230; --accent-soft:#1b2542;
  --ok:#62d69d; --warn:#f2bd5a; --bad:#ff8f87; --okbg:#10291e; --warnbg:#2d2411; --badbg:#351817; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.app{max-width:1240px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 12px;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.sm{padding:5px 9px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none;color:var(--accent)}
.brand h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:14px}

.drop{background:var(--surface);border:1.5px dashed var(--line);border-radius:12px;padding:36px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop h2{font-size:22px}
.drop p{margin:0;max-width:58ch;color:var(--muted)}
.drop .fine{font-size:13px}

.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{font-size:16px;font-weight:700}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.guide{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 12px;align-items:center}
.guide svg.mini{width:72px;height:56px;color:var(--muted);flex:none}
.guide{height:100px;overflow:hidden}
.guide .gt{min-width:0}
.guide .gt b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;font-size:16px;line-height:1.25}
.guide .gt span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;font-size:13.5px;color:var(--muted);line-height:1.35}
.guide .gb{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
@media (max-width:560px){.guide{grid-template-columns:auto minmax(0,1fr);height:148px;align-content:center} .guide .gb{grid-column:1/-1;justify-content:flex-start}}

.viewer{position:relative;background:var(--viewer);border-radius:10px;overflow:hidden;height:min(74vh,780px);min-height:360px;touch-action:none;user-select:none;-webkit-user-select:none}
.viewer canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{cursor:crosshair}
.viewer.hand #ov{cursor:grab}
#loupe{position:absolute;inset:auto;width:132px;height:132px;border-radius:50%;border:2px solid var(--mark);box-shadow:0 4px 18px rgba(0,0,0,.6);pointer-events:none;display:none}
.vtools{position:absolute;top:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 16px)}
.vtools .btn{background:rgba(18,24,31,.82);border-color:rgba(255,255,255,.22);color:#eef2f7;backdrop-filter:blur(4px)}
.vtools .btn[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:#241a00}
.vtag{position:absolute;left:8px;bottom:8px;right:8px;width:max-content;font-size:12px;color:#c9d2dd;background:rgba(18,24,31,.78);padding:3px 8px;border-radius:6px;pointer-events:none;max-width:calc(100% - 16px)}

.adjust{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px}
.adjust label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.adjust label span.v{font-family:var(--f-mono);color:var(--ink)}
.adjust input[type=range]{width:100%;accent-color:var(--accent)}
.adjust .full{grid-column:1/-1}
.adjust input[type=number],.fld input,.fld textarea,.fld select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
.calrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13.5px}
.calrow input{width:90px}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.steps .grp>b{font-size:12px;color:var(--muted);min-width:96px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px 3px 8px;font-size:13px}
.chip i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);flex:none}
.chip[data-st="done"] i{background:var(--ok);border-color:var(--ok)}
.chip[data-st="skip"]{opacity:.6}
.chip[data-st="skip"] i{border-style:dashed}
.chip[aria-current="step"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip[aria-current="step"] i{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;background:var(--surface)}
.card[data-l="0"]{border-color:var(--ok)}
.card[data-l="1"]{border-color:var(--warn)}
.card[data-l="2"]{border-color:var(--bad)}
.card .ct{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .ab{font-family:var(--f-mono);font-size:13px;letter-spacing:.04em;color:var(--muted)}
.card .nm{font-size:12.5px;color:var(--muted);line-height:1.3}
.card .val{font-family:var(--f-mono);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.card .val small{font-size:15px;color:var(--muted);margin-left:2px}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;width:max-content;max-width:100%}
.badge[data-l="0"]{background:var(--okbg);color:var(--ok)}
.badge[data-l="1"]{background:var(--warnbg);color:var(--warn)}
.badge[data-l="2"]{background:var(--badbg);color:var(--bad)}
.card .rf{font-size:12px;color:var(--muted);line-height:1.35}
.card.empty .val{color:var(--muted)}
.card .miss{font-size:12.5px}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:inherit}

.warns{display:flex;flex-direction:column;gap:6px}
.warn{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:7px 10px;font-size:13.5px}
.opts{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13.5px;align-items:center}
.opts label{display:flex;gap:6px;align-items:center}
.opts select{padding:3px 6px;background:var(--bg);border:1px solid var(--line);border-radius:6px}

pre.report{margin:0;white-space:pre-wrap;font-family:var(--f-mono);font-size:12.5px;line-height:1.5;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fld textarea{min-height:60px;resize:vertical}

.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.hist .hm{min-width:0;display:flex;flex-direction:column}
.hist .hm b{overflow-wrap:anywhere}
.hist .hm span{font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.hist label{display:flex;gap:6px;align-items:center;font-size:13px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;font-family:var(--f-mono)}
.tbl td.dl{font-weight:600}
details.defs{font-size:13.5px}
details.defs summary{cursor:pointer;font-weight:600}
details.defs dl{margin:8px 0 0;display:grid;gap:8px}
details.defs dt{font-family:var(--f-mono);font-size:12.5px}
details.defs dd{margin:0;color:var(--muted)}

.modal{position:fixed;inset:0;z-index:50;background:rgba(5,8,12,.7);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal[hidden]{display:none}
.mbox{background:var(--surface);border-radius:12px;max-width:min(960px,100%);max-height:100%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;width:100%}
.mbox img{max-width:100%;max-height:68vh;width:auto;height:auto;border-radius:8px;background:#000;align-self:center}
.mbox textarea{min-height:200px;font-family:var(--f-mono);font-size:12px}
.teach{border-color:var(--accent);background:var(--accent-soft)}
.foot{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px;max-width:90ch}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 3v13"/><path d="M15 16l-6.5 8.5h13z" fill="currentColor" fill-opacity=".18"/><circle cx="15" cy="4" r="1.6" fill="currentColor"/></svg>
      <div><h1>Plomada</h1><span data-i18n="tag"></span></div>
    </div>
    <div class="row">
      <button class="btn sm" id="bChange" type="button" data-i18n="btn.change" hidden></button>
      <button class="btn sm" id="bLang" type="button" aria-label="Language">EN</button>
    </div>
  </header>

  <section class="drop" id="drop" tabindex="0" aria-labelledby="dropT">
    <h2 id="dropT" data-i18n="drop.title"></h2>
    <p data-i18n="drop.sub"></p>
    <div class="row" style="justify-content:center">
      <button class="btn pri" id="bOpen" type="button" data-i18n="btn.open"></button>
      <button class="btn" id="bDemo" type="button" data-i18n="btn.demo"></button>
    </div>
    <div class="row" style="justify-content:center">
      <span class="fine muted" data-i18n="real.title"></span>
      <button class="btn sm" id="bRealFull" type="button" data-i18n="real.full"></button>
      <button class="btn sm" id="bRealLumbo" type="button" data-i18n="real.lumbo"></button>
      <button class="btn sm" id="bRealPerfil" type="button" data-i18n="real.perfil"></button>
    </div>
    <p class="fine" data-i18n="drop.hint"></p>
    <input id="file" type="file" accept="image/*" hidden>
  </section>

  <div id="work" hidden>
    <div class="grid">
      <section class="col" aria-label="Visor">
        <div class="guide" id="guide" aria-live="polite">
          <svg class="mini" id="mini" viewBox="0 0 72 56" aria-hidden="true"></svg>
          <div class="gt"><b id="gTitle"></b><span id="gHint"></span></div>
          <div class="gb">
            <button class="btn sm" id="bSkip" type="button" data-i18n="btn.skip"></button>
            <button class="btn sm" id="bUndo" type="button" data-i18n="btn.undo"></button>
            <button class="btn sm" id="bReset" type="button" data-i18n="btn.reset"></button>
          </div>
        </div>
        <div class="viewer" id="viewer">
          <canvas id="base"></canvas>
          <canvas id="ov"></canvas>
          <canvas id="loupe" width="132" height="132"></canvas>
          <div class="vtools">
            <button class="btn sm" id="bZin" type="button" aria-label="+">+</button>
            <button class="btn sm" id="bZout" type="button" aria-label="−">−</button>
            <button class="btn sm" id="bFit" type="button" data-i18n="tool.fit"></button>
            <button class="btn sm" id="bHand" type="button" aria-pressed="false" data-i18n="tool.hand"></button>
          </div>
          <div class="vtag" id="vtag"></div>
        </div>
        <p class="muted" style="margin:0;font-size:13px" data-i18n="guide.tip"></p>
        <div class="panel">
          <h2 data-i18n="adj.title"></h2>
          <div class="adjust">
            <label class="full">
              <span><span data-i18n="adj.rot"></span> · <span class="v" id="vRot"></span></span>
              <input id="rot" type="range" min="-25" max="25" step="0.1" value="0">
              <span data-i18n="adj.rot.hint" style="font-size:12.5px"></span>
            </label>
            <label><span><span data-i18n="adj.bright"></span> · <span class="v" id="vBri"></span></span><input id="bri" type="range" min="40" max="220" step="1" value="100"></label>
            <label><span><span data-i18n="adj.contrast"></span> · <span class="v" id="vCon"></span></span><input id="con" type="range" min="40" max="300" step="1" value="100"></label>
            <div class="row full">
              <button class="btn sm" id="bInv" type="button" aria-pressed="false" data-i18n="adj.invert"></button>
              <button class="btn sm" id="bGrid" type="button" aria-pressed="false" data-i18n="adj.grid"></button>
              <button class="btn sm" id="bAdjReset" type="button" data-i18n="adj.reset"></button>
            </div>
            <div class="full calrow">
              <b data-i18n="cal.title"></b>
              <label style="flex-direction:row;align-items:center;gap:6px"><span data-i18n="cal.len"></span><input id="calMM" type="number" min="1" step="1" value="100" inputmode="decimal"></label>
              <span class="muted" id="calState"></span>
            </div>
          </div>
        </div>
        <div class="panel">
          <h2 data-i18n="steps.title"></h2>
          <ol class="steps" id="steps"></ol>
        </div>
      </section>

      <section class="col" aria-label="Resultados">
        <div class="panel teach" id="teach" hidden>
          <h2 data-i18n="teach.title"></h2>
          <p id="teachT" style="margin:0"></p>
          <p id="teachD" class="muted" style="margin:0;font-size:12.5px"></p>
        </div>
        <div class="panel">
          <div class="row" style="justify-content:space-between"><h2 data-i18n="res.title"></h2></div>
          <div class="warns" id="warns"></div>
          <div class="cards" id="cards"></div>
          <div class="opts">
            <label><input type="checkbox" id="oNeg"><span data-i18n="opt.llneg"></span></label>
            <label><span data-i18n="opt.upper"></span><select id="oUp"><option value="T4">T4</option><option value="T5">T5</option></select></label>
          </div>
        </div>
        <div class="panel">
          <h2 data-i18n="rep.title"></h2>
          <pre class="report" id="report"></pre>
          <div class="row">
            <button class="btn" id="bCopy" type="button" data-i18n="rep.copy"></button>
            <button class="btn" id="bImg" type="button" data-i18n="img.btn"></button>
          </div>
        </div>
        <div class="panel">
          <h2 data-i18n="save.title"></h2>
          <label class="fld"><span data-i18n="save.name"></span><input id="sName" type="text" maxlength="60" autocomplete="off"></label>
          <label class="fld"><span data-i18n="save.note"></span><textarea id="sNote" maxlength="400"></textarea></label>
          <div class="row"><button class="btn pri" id="bSave" type="button" data-i18n="save.btn"></button><span class="muted" style="font-size:13px" id="saveMsg"></span></div>
        </div>
        <div class="panel">
          <div class="row" style="justify-content:space-between"><h2 data-i18n="h.title"></h2>
            <span class="row"><button class="btn sm" id="bExp" type="button" data-i18n="h.export"></button><button class="btn sm" id="bImp" type="button" data-i18n="h.import"></button></span></div>
          <ul class="hist" id="hist"></ul>
          <div class="tbl" id="cmp"></div>
        </div>
        <div class="panel">
          <details class="defs"><summary data-i18n="defs.title"></summary><dl id="defs"></dl></details>
        </div>
      </section>
    </div>
  </div>

  <footer class="foot"><span data-i18n="foot.priv"></span><span data-i18n="foot.disc"></span></footer>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

/* ---------------- Textos ---------------- */
const I18N={
es:{
'tag':'Parámetros espinopélvicos en una radiografía de perfil',
'drop.title':'Abre una radiografía de columna completa de perfil',
'drop.sub':'Sirve una foto de la placa o una captura del visor. La imagen se queda en tu dispositivo: no se sube a ningún servidor.',
'drop.hint':'Arrastra la imagen aquí o elige un archivo. JPG, PNG o WebP; los DICOM no se leen todavía, exporta una captura desde tu visor.',
'btn.open':'Elegir imagen','btn.demo':'Probar con un ejemplo','btn.change':'Cambiar imagen',
'btn.skip':'Omitir','btn.undo':'Deshacer','btn.reset':'Borrar puntos','btn.reset2':'¿Seguro? Pulsa otra vez',
'tool.fit':'Ajustar','tool.hand':'Mover imagen',
'guide.step':'Paso {n} de {m}','guide.done':'Todos los puntos están marcados','guide.donesub':'Arrastra un punto para afinarlo. Los resultados cambian al instante.',
'guide.tip':'Toca para marcar y arrastra para afinar con la lupa. Con dos dedos mueves y acercas. En computadora: rueda para acercar y Shift o «Mover imagen» para desplazar.',

const t=(k,v)=>{let s=I18N[lang][k]; if(s==null) s=I18N.es[k]; if(s==null) return k; if(v) for(const x in v) s=s.split('{'+x+'}').join(v[x]); return s;};

/* ---------------- Puntos a marcar ---------------- */
const STEPS=[
 {k:'fh1',g:'pelvis',kind:'fh',req:1,ab:'FH'},{k:'fh2',g:'pelvis',kind:'fh',req:0,ab:'FH2'},
 {k:'s1p',g:'pelvis',kind:'sp',req:1,ab:'S1p'},{k:'s1a',g:'pelvis',kind:'sa',req:1,ab:'S1a'},
 {k:'l1p',g:'lumbar',kind:'sp',req:1,ab:'L1p'},{k:'l1a',g:'lumbar',kind:'sa',req:1,ab:'L1a'},
 {k:'t12p',g:'thoracic',kind:'ip',req:0,ab:'T12p'},{k:'t12a',g:'thoracic',kind:'ia',req:0,ab:'T12a'},
 {k:'t4p',g:'thoracic',kind:'sp',req:0,ab:'p'},{k:'t4a',g:'thoracic',kind:'sa',req:0,ab:'a'},
 {k:'t1',g:'cervical',kind:'c',req:0,ab:'T1'},{k:'c7',g:'cervical',kind:'c',req:0,ab:'C7'},
 {k:'cal1',g:'cal',kind:'cal',req:0,ab:'A'},{k:'cal2',g:'cal',kind:'cal',req:0,ab:'B'}];
const STEPBY={}; STEPS.forEach(s=>STEPBY[s.k]=s);
const stepLabel=k=>t('p.'+k,{t:upperT}); const stepHint=k=>t('h.'+k,{t:upperT});
const abbr=k=>k==='t4p'?upperT+'p':k==='t4a'?upperT+'a':STEPBY[k].ab;

const nextActive=()=>{const s=STEPS.find(s=>!points[s.k]&&!skipped[s.k]); return s?s.k:null;};
const snap=()=>{undoStack.push(JSON.stringify({points,skipped})); if(undoStack.length>120) undoStack.shift();};
function undo(){ if(!undoStack.length) return false; const s=JSON.parse(undoStack.pop()); points=s.points; skipped=s.skipped; activeKey=nextActive(); return true; }

/* ---------------- Geometría ---------------- */
const fmt=(v,d=0)=>v==null?null:(Math.abs(v)<.5&&d===0?'0':v.toFixed(d));
function imgToScreen(p){const th=rot*Math.PI/180,c=Math.cos(th),s=Math.sin(th),x=p.x-img.w/2,y=p.y-img.h/2; return {x:view.ox+view.k*(x*c-y*s),y:view.oy+view.k*(x*s+y*c)};}
function screenToImg(q){const th=-rot*Math.PI/180,c=Math.cos(th),s=Math.sin(th),x=(q.x-view.ox)/view.k,y=(q.y-view.oy)/view.k; return {x:x*c-y*s+img.w/2,y:x*s+y*c+img.h/2};}
const calMmPerPx=()=>{ if(!points.cal1||!points.cal2||!(calMM>0)) return null; const d=Math.hypot(points.cal1.x-points.cal2.x,points.cal1.y-points.cal2.y); return d>1?calMM/d:null; };

function compute(){
  const out={v:{},warn:[],facing:1};
  if(!img) return out;
  const th=rot*Math.PI/180,cs=Math.cos(th),sn=Math.sin(th),cx=img.w/2,cy=img.h/2;
  const P={}; STEPS.forEach(s=>{const p=points[s.k]; P[s.k]=p?{x:(p.x-cx)*cs-(p.y-cy)*sn,y:(p.x-cx)*sn+(p.y-cy)*cs}:null;});
  let facing=1;
  for(const [a,b] of [['s1p','s1a'],['l1p','l1a'],['t12p','t12a'],['t4p','t4a']]){ if(P[a]&&P[b]&&Math.abs(P[b].x-P[a].x)>1e-6){facing=P[b].x>P[a].x?1:-1; break;} }
  out.facing=facing;

function reportText(c){
  const v=c.v, nm=$('sName').value.trim(), L=[]; const d=new Date().toLocaleDateString(lang==='en'?'en-US':'es-ES',{year:'numeric',month:'short',day:'numeric'});
  L.push('PLOMADA · '+t('rep.head')); L.push((nm?t('rep.patient')+': '+nm+' · ':'')+t('rep.date')+': '+d);
  const part=(k,u)=>v[k]==null?null:(k==='PIpLL'?'PI−LL':k)+' '+fmtV(k,v[k])+u;
  const tag=(k)=>{const j=judge(k,v[k],v); return j&&j.srs?' ('+SYM[j.l]+')':'';};
  const l1=[part('PI','°'),part('PT','°')&&part('PT','°')+tag('PT'),part('SS','°')].filter(Boolean).join(' · '); if(l1) L.push(l1);
  const l2=[part('LL','°'),part('PIpLL','°')&&part('PIpLL','°')+tag('PIpLL')].filter(Boolean).join(' · '); if(l2) L.push(l2);
  const l3=[v.TK!=null?part('TK','°')+' ('+upperT+'–T12)':null,part('T1PA','°')].filter(Boolean).join(' · '); if(l3) L.push(l3);
  if(v.SVA!=null) L.push('SVA '+v.SVA.toFixed(0)+' mm'+tag('SVA')); else if(c.SVApx!=null) L.push('SVA '+c.SVApx.toFixed(0)+' px');
  const mods=['PIpLL','PT','SVA'].filter(k=>v[k]!=null).map(k=>(k==='PIpLL'?'PI−LL':k)+' '+SYM[judge(k,v[k],v).l]); if(mods.length) L.push(t('rep.mod')+': '+mods.join(' · '));
  // Procedimiento realizado
  L.push(''); L.push(t('rep.done'));
  L.push('· '+t('rep.img')+': '+(isDemo?t('vtag.demo'):credit?t(credit).split(' · ').slice(0,2).join(' · '):t('rep.own')));
  L.push('· '+t('rep.tilt',{v:rot.toFixed(1)}));
  L.push('· '+(c.mmpp?t('rep.calOk',{mm:calMM,v:c.mmpp.toFixed(3)}):t('rep.calNo')));
  const placed=STEPS.filter(s=>points[s.k]).map(s=>abbr(s.k)), skp=STEPS.filter(s=>skipped[s.k]).map(s=>abbr(s.k));
  L.push('· '+t('rep.placed',{n:placed.length,m:STEPS.length})+(placed.length?': '+placed.join(', '):''));
  if(skp.length) L.push('· '+t('rep.skipped')+': '+skp.join(', '));
  const got=PARAMS.filter(p=>v[p.k]!=null||(p.k==='SVA'&&c.SVApx!=null)).map(p=>p.k==='PIpLL'?'PI−LL':p.k);
  L.push('· '+t('rep.measured')+': '+(got.length?got.join(', '):'—'));
  // Pendiente
  L.push(''); L.push(t('rep.todo'));
  const todo=[];
  PARAMS.forEach(p=>{ const miss=NEED[p.k].filter(k=>!points[k]); if(miss.length) todo.push('· '+t('rep.need',{p:p.k==='PIpLL'?'PI−LL':p.k,pts:miss.map(stepLabel).join('; ')})); });
  if(c.SVApx!=null&&!c.mmpp) todo.push('· '+t('w.cal'));
  [...new Set(c.warn)].filter(w=>w!==t('w.cal')).forEach(w=>todo.push('· '+w));
  if(!todo.length) todo.push('· '+t('rep.alldone'));
  todo.push('· '+t('rep.review'));
  L.push(...todo);
  L.push(''); L.push(t('rep.notmed')); L.push(t('rep.disc')); return L.join('\n');
}
function updateHistory(){
  const ul=$('hist'); if(!history.length){ ul.innerHTML='<li class="muted" style="border:0;padding:0">'+t('h.empty')+'</li>'; $('cmp').innerHTML=''; return; }
  const loc=lang==='en'?'en-US':'es-ES';
  ul.innerHTML=history.slice().reverse().map(h=>{ const x=h.vals, bits=[x.PI!=null?'PI '+x.PI.toFixed(0):'',x.PT!=null?'PT '+x.PT.toFixed(0):'',x.LL!=null?'LL '+x.LL.toFixed(0):''].filter(Boolean).join(' · ');
    return '<li><div class="hm"><b>'+esc(h.name||'—')+'</b><span>'+esc(new Date(h.ts).toLocaleString(loc,{dateStyle:'medium',timeStyle:'short'}))+(bits?' · '+bits:'')+'</span>'+(h.note?'<span style="font-family:inherit">'+esc(h.note)+'</span>':'')+'</div><div class="row"><label><input type="checkbox" data-cmp="'+h.id+'"'+(cmpSel.includes(h.id)?' checked':'')+'>'+t('h.cmp')+'</label><button class="btn sm" type="button" data-del="'+h.id+'">'+t('h.del')+'</button></div></li>'; }).join('');
  const sel=cmpSel.map(id=>history.find(h=>h.id===id)).filter(Boolean);
  if(sel.length<2){ $('cmp').innerHTML='<p class="muted" style="margin:0;font-size:13px">'+t('h.pick')+'</p>'; return; }
  const [A,B]=sel.sort((p,q)=>p.ts-q.ts); let rows='';
  PARAMS.forEach(p=>{ const a=A.vals[p.k], b=B.vals[p.k]; if(a==null&&b==null) return; const da=a==null?null:(p.k==='LL'&&negLL?-a:a), db=b==null?null:(p.k==='LL'&&negLL?-b:b);
    const d=da!=null&&db!=null?db-da:null; const f=x=>x==null?'—':(p.k==='SVA'?x.toFixed(0):x.toFixed(1).replace(/\.0$/,''));
    rows+='<tr><td>'+(p.k==='PIpLL'?'PI−LL':p.k)+'</td><td>'+f(da)+'</td><td>'+f(db)+'</td><td class="dl">'+(d==null?'—':(d>0?'+':'')+f(d).replace('-','−'))+'</td></tr>'; });
  $('cmp').innerHTML='<table><thead><tr><th></th><th>'+esc(A.name||'A')+'</th><th>'+esc(B.name||'B')+'</th><th>'+t('h.delta')+'</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function applyI18n(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});
  $('bLang').textContent=lang==='es'?'EN':'ES';
  $('defs').innerHTML=PARAMS.map(p=>'<div><dt>'+(p.k==='PIpLL'?'PI−LL':p.k)+' · '+t('n.'+p.k)+'</dt><dd>'+esc(t('d.'+p.k,{t:upperT}))+'<br>'+esc(p.k==='LL'?t('r.LL0'):t('r.'+p.k))+'</dd></div>').join('');
  const vt=isDemo?t('vtag.demo'):credit?t(credit):''; $('vtag').textContent=vt; $('vtag').style.display=vt?'block':'none';
  $('teach').hidden=!teachKey; if(teachKey){ $('teachT').textContent=t(teachKey); $('teachD').textContent=t('teach.disc'); }
  $('oNeg').checked=negLL; $('oUp').value=upperT;
  setFilters(); updateUI(); updateHistory();
}

  g.font='600 22px sans-serif'; g.fillStyle='rgba(255,201,51,.95)'; g.fillText(t('demo.tag'),M,M-14);
  const pt=a=>({x:X(a[0]),y:Y(a[1])}), tk=get('T4');
  const P0={fh1:pt(F1),fh2:pt(F2),s1p:pt(S1.sp),s1a:pt(S1.sa),l1p:pt(get('L1').sp),l1a:pt(get('L1').sa),t12p:pt(get('T12').ip),t12a:pt(get('T12').ia),t4p:pt(tk.sp),t4a:pt(tk.sa),t1:pt(get('T1').c),c7:pt(get('C7').c),cal1:{x:X(rx),y:Y(ry0)},cal2:{x:X(rx),y:Y(ry0+100)}};
  return {c,w:cw,h:ch,P0,mm:100};
}
function startDemo(){ const d=makeDemo(); loadSource(d.c,d.w,d.h,true); upperT='T4'; $('oUp').value='T4'; snap(); points=JSON.parse(JSON.stringify(d.P0)); calMM=d.mm; $('calMM').value=d.mm; activeKey=nextActive(); selKey=null; undoStack=[]; applyI18n(); refresh(); }

/* ---------------- Exportar imagen con mediciones ---------------- */
function openModal(node){ const mb=$('mbox'); mb.innerHTML=''; mb.appendChild(node); $('modal').hidden=false; }
function closeModal(){ $('modal').hidden=true; $('mbox').innerHTML=''; }
$('modal').addEventListener('click',e=>{ if(e.target===$('modal')||e.target.closest('[data-close]')) closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('modal').hidden) closeModal(); });
function annotated(){
  const K=Math.max(1,1000/img.w), Wc=Math.round(img.w*K), Hc=Math.round(img.h*K);
  const c=document.createElement('canvas'); c.width=Wc; c.height=Hc; const g=c.getContext('2d'); g.fillStyle='#0b0f13'; g.fillRect(0,0,Wc,Hc);
  const th=rot*Math.PI/180; g.save(); g.translate(Wc/2,Hc/2); g.rotate(th); g.scale(K,K);
  try{ g.filter=base.style.filter||'none'; }catch(_){}
  g.imageSmoothingQuality='high'; g.drawImage(img.src,-img.w/2,-img.h/2); g.restore(); try{g.filter='none';}catch(_){}
  const S=p=>{const x=(p.x-img.w/2)*K,y=(p.y-img.h/2)*K; return {x:Wc/2+x*Math.cos(th)-y*Math.sin(th),y:Hc/2+x*Math.sin(th)+y*Math.cos(th)};};
  overlay(g,S,Math.max(1.6,Wc/560),true,compute()); return c;
}
$('bImg').addEventListener('click',()=>{
  if(!img) return; const c=annotated(), url=c.toDataURL('image/png'), box=document.createElement('div'); box.style.display='contents';
  box.innerHTML='<h2>'+t('img.title')+'</h2><p class="muted" style="margin:0;font-size:13.5px">'+(window.claude?t('img.hint2'):t('img.hint'))+'</p><img alt="'+esc(t('img.title'))+'"><div class="row">'+(window.claude?'':'<a class="btn pri" download="plomada.png" style="text-decoration:none">'+t('img.dl')+'</a>')+'<button class="btn" type="button" data-close>'+t('close')+'</button></div>';
  box.querySelector('img').src=url; if(box.querySelector('a')) box.querySelector('a').href=url; openModal(box);
});

/* ---------------- Acciones ---------------- */
$('bOpen').addEventListener('click',()=>$('file').click());
$('bChange').addEventListener('click',()=>$('file').click());
$('file').addEventListener('change',e=>{ if(e.target.files[0]) openFile(e.target.files[0]); e.target.value=''; });
$('bDemo').addEventListener('click',startDemo);
$('bRealLumbo').addEventListener('click',()=>loadSample('lumbo'));
$('bRealFull').addEventListener('click',()=>loadSample('full'));
$('bRealPerfil').addEventListener('click',()=>loadSample('perfil'));
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{ if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){ e.preventDefault(); $('drop').classList.add('over'); } }));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{ if(ev==='dragleave'&&e.relatedTarget) return; $('drop').classList.remove('over'); }));
document.addEventListener('drop',e=>{ if(e.dataTransfer&&e.dataTransfer.files.length){ e.preventDefault(); openFile(e.dataTransfer.files[0]); } });
$('drop').addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); $('file').click(); } });
$('bLang').addEventListener('click',()=>{ lang=lang==='es'?'en':'es'; store.set('plomada-lang',lang); applyI18n(); });
$('bZin').addEventListener('click',()=>zoomBy(1.35)); $('bZout').addEventListener('click',()=>zoomBy(1/1.35)); $('bFit').addEventListener('click',fit);
$('bHand').addEventListener('click',()=>{ handMode=!handMode; $('bHand').setAttribute('aria-pressed',handMode); updateGuide(); });
$('bSkip').addEventListener('click',()=>{ if(!activeKey) return; snap(); skipped[activeKey]=1; activeKey=nextActive(); refresh(); });
$('bUndo').addEventListener('click',()=>{ if(undo()){ refresh(); toast(t('toast.undo')); } });
$('bReset').addEventListener('click',()=>{ if(!resetArm){ resetArm=1; updateGuide(); setTimeout(()=>{resetArm=0; updateGuide();},3000); return; } resetArm=0; snap(); points={}; skipped={}; activeKey=nextActive(); selKey=null; refresh(); });
$('steps').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; activeKey=b.dataset.k; delete skipped[activeKey]; refresh(); });
$('cards').addEventListener('click',e=>{ const b=e.target.closest('.link'); if(!b||!b.dataset.k) return; activeKey=b.dataset.k; delete skipped[activeKey]; refresh(); viewer.scrollIntoView({block:'nearest',behavior:'smooth'}); });
$('rot').addEventListener('input',()=>{ rot=+$('rot').value; setFilters(); refresh(); });
['bri','con'].forEach(id=>$(id).addEventListener('input',setFilters));
$('bInv').addEventListener('click',()=>{ const b=$('bInv'); b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true'); setFilters(); });
$('bGrid').addEventListener('click',()=>{ grid=!grid; $('bGrid').setAttribute('aria-pressed',grid); draw(); });
$('bAdjReset').addEventListener('click',()=>{ $('rot').value=0; rot=0; $('bri').value=100; $('con').value=100; $('bInv').setAttribute('aria-pressed','false'); setFilters(); refresh(); });
$('calMM').addEventListener('input',()=>{ calMM=parseFloat($('calMM').value); refresh(); });
$('oNeg').addEventListener('change',()=>{ negLL=$('oNeg').checked; store.set('plomada-negll',negLL); updateUI(); updateHistory(); });
$('oUp').addEventListener('change',()=>{ upperT=$('oUp').value; store.set('plomada-upper',upperT); updateUI(); });
$('sName').addEventListener('input',()=>{ $('report').textContent=reportText(lastCalc||compute()); });
$('bCopy').addEventListener('click',async()=>{ const txt=$('report').textContent; try{ await navigator.clipboard.writeText(txt); toast(t('rep.copied')); }catch(_){ const r=document.createRange(); r.selectNodeContents($('report')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast(t('rep.fail')); } });
$('bSave').addEventListener('click',()=>{
  const c=compute(); if(c.v.PI==null){ $('saveMsg').textContent=t('save.need'); return; }
  const vals={}; PARAMS.forEach(p=>vals[p.k]=c.v[p.k]);
  history.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),ts:Date.now(),name:$('sName').value.trim().slice(0,60),note:$('sNote').value.trim().slice(0,400),vals,pts:points,rot,calMM,up:upperT});
  store.set('plomada-hist',history); $('saveMsg').textContent=t('save.ok'); toast(t('save.ok')); updateHistory();
});
$('hist').addEventListener('click',e=>{ const d=e.target.closest('[data-del]'); if(d){ history=history.filter(h=>h.id!==d.dataset.del); cmpSel=cmpSel.filter(i=>i!==d.dataset.del); store.set('plomada-hist',history); updateHistory(); } });
$('hist').addEventListener('change',e=>{ const c=e.target.closest('[data-cmp]'); if(!c) return; const id=c.dataset.cmp; cmpSel=c.checked?[...cmpSel.filter(i=>i!==id),id].slice(-2):cmpSel.filter(i=>i!==id); updateHistory(); });
$('bExp').addEventListener('click',()=>{ const b=document.createElement('div'); b.style.display='contents'; b.innerHTML='<h2>'+t('h.exportT')+'</h2><p class="muted" style="margin:0;font-size:13.5px">'+t('h.exportHint')+'</p><textarea id="xta" readonly></textarea><div class="row"><button class="btn pri" type="button" id="xcp">'+t('h.copy')+'</button><button class="btn" type="button" data-close>'+t('close')+'</button></div>'; b.querySelector('textarea').value=JSON.stringify(history);
  openModal(b); $('xcp').addEventListener('click',async()=>{ try{ await navigator.clipboard.writeText($('xta').value); toast(t('rep.copied')); }catch(_){ $('xta').select(); toast(t('rep.fail')); } }); });
$('bImp').addEventListener('click',()=>{ const b=document.createElement('div'); b.style.display='contents'; b.innerHTML='<h2>'+t('h.importT')+'</h2><p class="muted" style="margin:0;font-size:13.5px">'+t('h.importHint')+'</p><textarea id="ita"></textarea><div class="row"><button class="btn pri" type="button" id="ibt">'+t('h.importBtn')+'</button><button class="btn" type="button" data-close>'+t('close')+'</button></div>'; openModal(b);
  $('ibt').addEventListener('click',()=>{ try{ const a=JSON.parse($('ita').value); if(!Array.isArray(a)) throw 0; let n=0; a.forEach(h=>{ if(h&&h.vals&&typeof h.ts==='number'&&!history.some(x=>x.id===h.id)){ history.push({id:String(h.id||Date.now().toString(36)+n),ts:h.ts,name:String(h.name||'').slice(0,60),note:String(h.note||'').slice(0,400),vals:h.vals,pts:h.pts||{},rot:+h.rot||0,calMM:+h.calMM||100,up:h.up||'T4'}); n++; } }); history.sort((p,q)=>p.ts-q.ts); store.set('plomada-hist',history); updateHistory(); closeModal(); toast(t('h.imported',{n})); }catch(_){ toast(t('h.bad')); } }); });

if(window.ResizeObserver) new ResizeObserver(()=>{ if(img) resize(); }).observe(viewer); else window.addEventListener('resize',()=>{ if(img) resize(); });
$('calMM').value=calMM; applyI18n();
</script>
